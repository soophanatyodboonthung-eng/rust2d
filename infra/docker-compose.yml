# Rust2D dev infrastructure — PostgreSQL for local development.
# Dev credentials only. Production (VPS) uses secrets, see docs/runbook.md (Phase 7).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rust2d
      POSTGRES_PASSWORD: rust2d_dev
      POSTGRES_DB: rust2d
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rust2d -d rust2d']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
